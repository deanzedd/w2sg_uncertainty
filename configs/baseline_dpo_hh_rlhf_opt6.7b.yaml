# Baseline DPO on HH-RLHF, OPT-6.7B (strong), one shared H100 (~18 GB for this job).
# Same settings as configs/baseline_dpo_hh_rlhf.yaml (Qwen family) except the model, batch layout, output
# paths and the DPO effective batch: 8 here, as in every other HH and TL;DR run (that file uses 8 x 2 = 16).
#
# Usage:
#   python pipeline/run_pipeline.py --config configs/baseline_dpo_hh_rlhf_opt6.7b.yaml

defaults:
  - base

seed: 42
method: baseline_dpo
dataset_name: hh_rlhf
labeled_ratio: 0.3
max_prompt_length: 512                # HH-RLHF: loader drops samples > 512 tokens; max_length 512 from base

strong_model_name: facebook/opt-6.7b

device_map: null

use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: null

sft:
  output_dir: outputs/baseline_dpo/hh_rlhf/opt-6.7b/seed42/sft_strong
  num_train_epochs: 3
  per_device_train_batch_size: 4          # OPT-6.7B (13.3 GB bf16) in ~18 GB
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4          # effective batch 16
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 100
  weight_decay: 0.05
  optim: paged_adamw_32bit
  gradient_checkpointing: true
  save_steps: 5000
  eval_steps: 10000

training:
  output_dir: outputs/baseline_dpo/hh_rlhf/opt-6.7b/seed42/strong_model
  num_train_epochs: 5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4          # effective batch 8
  learning_rate: 5.0e-6
  beta: 0.5
  weight_decay: 0.05
  optim: paged_adamw_32bit
  warmup_steps: 100
  gradient_checkpointing: true
  save_steps: 5000
  eval_steps: 30000

eval:
  max_gen_samples: 500      # same as all other runs; base default (null) would generate for the whole test split
  gen_batch_size: 8         # KV cache for 8 x (512 + 512) tokens next to the 13.3 GB policy
  output_dir: outputs/baseline_dpo/hh_rlhf/opt-6.7b/seed42/eval

wandb_run_name: h100-baseline-dpo-hh_rlhf-opt6.7b
