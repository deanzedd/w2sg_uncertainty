# CWPO on HH-RLHF, OPT-125m (weak) -> OPT-13B (strong), one shared H100 (~27 GB for this job).
# Same settings as configs/cwpo_hh_rlhf.yaml (Qwen family) except the models, batch layout and output
# paths. Effective batches are unchanged (SFT 16, DPO 8).
#
# Usage:
#   python pipeline/run_pipeline.py --config configs/cwpo_hh_rlhf_opt13b.yaml

defaults:
  - base

seed: 42
method: cwpo
dataset_name: hh_rlhf
labeled_ratio: 0.3
max_prompt_length: 512                # HH-RLHF: loader drops samples > 512 tokens; max_length 512 from base

weak_model_name: facebook/opt-125m
strong_model_name: facebook/opt-13b

device_map: null

use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: null

reward_model:
  num_train_epochs: 5
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.0
  save_steps: 20000
  output_dir: outputs/cwpo/hh_rlhf/opt-13b/seed42/reward_model
  eval_steps: 20000

sft:
  output_dir: outputs/cwpo/hh_rlhf/opt-13b/seed42/sft_strong
  num_train_epochs: 3
  per_device_train_batch_size: 2          # OPT-13B (25.7 GB bf16) in ~27 GB
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8          # effective batch 16
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 100
  weight_decay: 0.05
  optim: paged_adamw_32bit
  gradient_checkpointing: true
  save_steps: 2000

training:
  output_dir: outputs/cwpo/hh_rlhf/opt-13b/seed42/strong_model
  num_train_epochs: 5
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8          # effective batch 8
  learning_rate: 5.0e-6
  beta: 0.5
  weight_decay: 0.05
  optim: paged_adamw_32bit
  warmup_steps: 100
  gradient_checkpointing: true
  save_steps: 2000

eval:
  max_gen_samples: 500      # same as all other runs; base default (null) would generate for the whole test split
  gen_batch_size: 4         # KV cache for 4 x (512 + 512) tokens next to the 25.7 GB policy
  output_dir: outputs/cwpo/hh_rlhf/opt-13b/seed42/eval

weak_label_output_dir: outputs/cwpo/hh_rlhf/opt-13b/seed42/weak_labels
wandb_run_name: h100-cwpo-hh_rlhf-opt13b
